<style>
  :root{
    --bg:#0e0e11; --card:#15151b; --ink:#ececf1; --muted:#b5b7c3;
    --brandA:#6a11cb; --brandB:#2575fc; --line:#3a66ff;
    --ring:0 0 0 .2rem rgba(37,117,252,.35);
    --radius:16px; --shadow:0 10px 30px rgba(0,0,0,.35);

    --rule:rgba(255,255,255,.07);
    --rule-strong:rgba(255,255,255,.13);
    --row:rgba(255,255,255,.018);
    --row-hover:rgba(255,255,255,.045);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --ease:cubic-bezier(.22,.61,.36,1);

    --tag-added:#7fd6a2;   --tag-added-bg:rgba(93,200,140,.11);   --tag-added-br:rgba(93,200,140,.26);
    --tag-removed:#ef9490; --tag-removed-bg:rgba(224,110,105,.11); --tag-removed-br:rgba(224,110,105,.26);
    --tag-changed:#93b6ff; --tag-changed-bg:rgba(110,150,240,.11); --tag-changed-br:rgba(110,150,240,.26);
    --tag-moved:#e3bb7c;   --tag-moved-bg:rgba(214,170,100,.11);   --tag-moved-br:rgba(214,170,100,.26);
    --tag-note:#c3aef0;    --tag-note-bg:rgba(106,17,203,.14);     --tag-note-br:rgba(106,17,203,.3);

    --tier-obsidian:#a78bfa;
    --tier-amethyst:#c084d8;
    --tier-pearl:#9fc4d8;
    --tier-extreme:#e08f8a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:linear-gradient(180deg,#0b0b0e,#121219 60%,#0d0d14);
    color:var(--ink);
    background-attachment:fixed;
    font-family:'Rubik',system-ui,-apple-system,Segoe UI,Roboto,Arial,Helvetica,sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    scroll-behavior:smooth;
  }
  .wrap{max-width:1024px; margin:0 auto; padding:0 16px}

  header{
    position:sticky; top:0; z-index:50; backdrop-filter:saturate(140%) blur(10px);
    background:rgba(10,10,14,.6); border-bottom:1px solid rgba(255,255,255,.06);
  }
  .bar{display:flex; align-items:center; justify-content:space-between; padding:12px 0}
  .logo{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink)}
  .logo-img{width:28px; height:28px; border-radius:10px; object-fit:contain; box-shadow:var(--shadow)}
  .logo .mark{font-size:1.05rem; font-weight:700; letter-spacing:.3px}
  nav{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  nav a{
    color:var(--ink); text-decoration:none; font-weight:500; margin-left:0;
    padding:8px 10px; border-radius:10px; opacity:.9
  }
  nav a:hover, nav a:focus-visible{background:rgba(255,255,255,.06); outline:none; box-shadow:var(--ring)}

  .modal{display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.8); backdrop-filter:blur(5px); z-index:1000; align-items:center; justify-content:center}
  .modal.active{display:flex}
  .modal-content{background:var(--card); border-radius:var(--radius); max-width:450px; width:90%; box-shadow:0 20px 60px rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.1); animation:modalSlideIn 0.3s ease-out}
  @keyframes modalSlideIn{from{transform:translateY(-50px); opacity:0} to{transform:translateY(0); opacity:1}}
  .modal-header{padding:20px 24px; border-bottom:1px solid rgba(255,255,255,.06)}
  .modal-header h3{margin:0; font-size:1.2rem}
  .modal-body{padding:24px; line-height:1.6}
  .modal-body p{margin:0}
  .modal-footer{padding:16px 24px; border-top:1px solid rgba(255,255,255,.06); display:flex; gap:12px; justify-content:flex-end}
  .btn{display:inline-block; text-decoration:none; color:white; font-weight:700; letter-spacing:.2px; padding:10px 14px; border-radius:12px; background:linear-gradient(120deg,var(--brandA),var(--brandB)); border:none; cursor:pointer; font-size:.95rem}
  .btn-ghost{background:rgba(255,255,255,.05); color:var(--ink); border:1px solid rgba(255,255,255,.1); padding:10px 20px; border-radius:10px; font-weight:600; cursor:pointer; font-size:.95rem}

  footer{border-top:1px solid rgba(255,255,255,.08); color:var(--muted); padding:24px 0 36px; text-align:center}

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
  }

  .section{padding:34px 0 8px}
  .section:first-of-type{padding-top:44px}
  .section + .section{border-top:1px solid var(--rule)}
  .section-head{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:6px}
  .section-head h2{
    font-size:clamp(1.15rem,2.6vw,1.5rem); font-weight:700;
    letter-spacing:-.01em; margin:0
  }
  .section-count{
    font-family:var(--mono); font-size:.72rem; color:var(--muted);
    padding:3px 7px; border:1px solid var(--rule-strong); border-radius:4px; opacity:.8
  }
  .section-sub{color:var(--muted); font-size:.85rem; margin:0 0 14px}

  .tier{padding-top:18px}
  .tier-head{
    display:flex; align-items:baseline; gap:10px;
    margin:0 0 10px; font-size:.95rem; font-weight:500; letter-spacing:.01em;
  }
  .tier-head .dot{
    width:7px; height:7px; border-radius:2px; flex:0 0 auto;
    transform:translateY(-1px);
  }
  .tier-head .range{
    font-family:var(--mono); font-size:.68rem; color:var(--muted); opacity:.55;
    font-weight:400; letter-spacing:.05em;
  }
  .tier-obsidian .dot{background:var(--tier-obsidian)}
  .tier-obsidian .label{color:var(--tier-obsidian)}
  .tier-amethyst .dot{background:var(--tier-amethyst)}
  .tier-amethyst .label{color:var(--tier-amethyst)}
  .tier-pearl .dot{background:var(--tier-pearl)}
  .tier-pearl .label{color:var(--tier-pearl)}
  .tier-extreme .dot{background:var(--tier-extreme)}
  .tier-extreme .label{color:var(--tier-extreme)}

  .list{list-style:none; margin:0; padding:0}
  .list li{
    display:grid; grid-template-columns:52px 1fr auto; column-gap:14px;
    align-items:start; padding:15px 12px 15px 6px;
    border-bottom:1px solid var(--rule); background:var(--row);
    transition:background .16s var(--ease), transform .16s var(--ease);
  }
  .list li:first-child{border-top:1px solid var(--rule)}
  .list li:hover{background:var(--row-hover); transform:translateX(3px)}

  .rank{
    font-family:var(--mono); font-size:1.15rem; font-weight:500;
    color:var(--muted); opacity:.55; text-align:right; padding-top:1px;
    font-variant-numeric:tabular-nums;
  }
  .list li:nth-child(1) .rank{opacity:1; color:#c9a6ff}
  .list li:nth-child(2) .rank{opacity:.9; color:#9fb8ff}
  .list li:nth-child(3) .rank{opacity:.8; color:#8fa0c8}

  .tier:not(:first-of-type) .list li:nth-child(1) .rank,
  .tier:not(:first-of-type) .list li:nth-child(2) .rank,
  .tier:not(:first-of-type) .list li:nth-child(3) .rank{
    opacity:.55; color:var(--muted);
  }

  .name{font-size:1.02rem; font-weight:500; line-height:1.3; margin:0 0 5px}
  .name .lvl-id{
    font-family:var(--mono); font-size:.7rem; font-weight:400;
    color:var(--muted); opacity:.5; margin-left:9px; letter-spacing:.02em;
  }
  .credit{font-size:.83rem; color:var(--muted); margin:0; line-height:1.5}
  .credit + .credit{margin-top:1px}
  .credit.struck{text-decoration:line-through; text-decoration-thickness:1px; opacity:.45}
  .note{
    font-size:.8rem; color:var(--muted); opacity:.8; margin:7px 0 0;
    padding-left:9px; border-left:2px solid var(--rule-strong); font-style:italic;
  }

  .fp{display:flex; flex-wrap:wrap; gap:5px; margin:8px 0 0; padding:0; list-style:none}
  .fp li{
    display:block; padding:2px 7px; border:none; background:rgba(255,255,255,.05);
    border-radius:3px; font-family:var(--mono); font-size:.71rem; color:var(--muted);
    letter-spacing:.01em; transform:none;
  }
  .fp li:first-child{border-top:none}
  .fp li:hover{background:rgba(255,255,255,.05); transform:none}

  .rail{text-align:right; padding-top:2px; min-width:60px}
  .rail .num{
    display:block; font-family:var(--mono); font-size:1.3rem; font-weight:500;
    line-height:1; font-variant-numeric:tabular-nums; color:var(--ink);
  }
  .rail .unit{
    display:block; font-size:.63rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); opacity:.6; margin-top:5px;
  }
  .rail .tag{
    display:inline-block; font-family:var(--mono); font-size:.72rem; color:var(--muted);
    padding:3px 8px; border:1px solid var(--rule-strong); border-radius:4px; white-space:nowrap;
  }

  .pills{display:flex; flex-wrap:wrap; gap:6px; margin:7px 0 0}
  .pill{
    display:inline-block; padding:2px 8px; border-radius:4px;
    font-family:var(--mono); font-size:.68rem; letter-spacing:.03em;
    border:1px solid var(--rule-strong); color:var(--muted);
  }
  .pill-diff{color:#e0a0a0; background:rgba(210,120,120,.1); border-color:rgba(210,120,120,.24)}
  .pill-gddp{color:#a8c8e8; background:rgba(140,180,225,.1); border-color:rgba(140,180,225,.26)}
  .pill-feat-1{color:#9fd4f0; background:rgba(120,190,230,.1); border-color:rgba(120,190,230,.24)}
  .pill-feat-2{color:#e3c47c; background:rgba(214,180,100,.1); border-color:rgba(214,180,100,.24)}
  .pill-feat-3{color:#f0b0d8; background:rgba(230,140,200,.1); border-color:rgba(230,140,200,.24)}
  .pill-feat-4{color:#c3aef0; background:rgba(150,120,230,.12); border-color:rgba(150,120,230,.28)}

  .placement{
    display:inline-block; margin-top:8px; padding:3px 8px;
    background:var(--tag-note-bg); border:1px solid var(--tag-note-br);
    border-radius:4px; font-family:var(--mono); font-size:.71rem; color:var(--tag-note);
  }

  .list.compact li{padding:11px 12px 11px 6px; align-items:center}
  .list.compact .name{margin:0; font-size:.95rem}
  .list.compact .rank{font-size:.95rem}

  .log{margin:0; padding:0}
  .log-day{
    display:grid; grid-template-columns:118px 1fr; column-gap:22px;
    padding:20px 0; border-top:1px solid var(--rule);
  }
  .log-day:last-child{border-bottom:1px solid var(--rule)}
  .log-when{
    font-family:var(--mono); font-size:.74rem; color:var(--muted); opacity:.7;
    letter-spacing:.04em; padding-top:3px; font-variant-numeric:tabular-nums;
  }
  .log-title{font-size:.88rem; font-weight:500; color:#d6d8e4; margin:0 0 9px}
  .log-items{list-style:none; margin:0; padding:0}
  .log-items li{
    display:flex; gap:10px; align-items:baseline;
    padding:5px 0; font-size:.855rem; line-height:1.5; color:var(--muted);
  }
  .chg{
    flex:0 0 auto; font-family:var(--mono); font-size:.61rem; font-weight:500;
    letter-spacing:.1em; text-transform:uppercase; padding:2px 6px; border-radius:3px;
    border:1px solid var(--rule-strong); color:var(--muted); min-width:62px; text-align:center;
  }
  .chg-added  {color:var(--tag-added);   background:var(--tag-added-bg);   border-color:var(--tag-added-br)}
  .chg-removed{color:var(--tag-removed); background:var(--tag-removed-bg); border-color:var(--tag-removed-br)}
  .chg-changed{color:var(--tag-changed); background:var(--tag-changed-bg); border-color:var(--tag-changed-br)}
  .chg-moved  {color:var(--tag-moved);   background:var(--tag-moved-bg);   border-color:var(--tag-moved-br)}
  .chg-note   {color:var(--tag-note);    background:var(--tag-note-bg);    border-color:var(--tag-note-br)}

  @media (max-width:560px){
    .list li{grid-template-columns:34px 1fr; row-gap:9px}
    .rank{font-size:1rem}
    .rail{grid-column:2; text-align:left; padding-top:0}
    .rail .num{display:inline; font-size:1rem}
    .rail .unit{display:inline; margin-left:5px; letter-spacing:.1em}
    .list li:hover{transform:none}
    .name .lvl-id{display:block; margin-left:0; margin-top:3px}
    .log-day{grid-template-columns:1fr; row-gap:10px}
    .log-when{padding-top:0}
    .log-items li{flex-direction:column; gap:4px}
    .chg{min-width:0; align-self:flex-start}
  }

  html{color-scheme:dark}

  select, input, textarea, button{
    color-scheme:dark;
    background-color:var(--card); color:var(--ink);
    border:1px solid rgba(255,255,255,.1); border-radius:8px;
  }
  select option{background:var(--card); color:var(--ink)}
  input::placeholder, textarea::placeholder{color:var(--muted)}
  select:focus, input:focus, textarea:focus{outline:none; box-shadow:var(--ring); border-color:rgba(37,117,252,.4)}

  ::-webkit-scrollbar{width:8px; height:8px}
  ::-webkit-scrollbar-track{background:rgba(14,14,17,.6)}
  ::-webkit-scrollbar-thumb{
    background:linear-gradient(180deg, rgba(106,17,203,.35), rgba(37,117,252,.35));
    border-radius:8px; border:2px solid transparent; background-clip:padding-box;
  }
  ::-webkit-scrollbar-thumb:hover{
    background:linear-gradient(180deg, rgba(106,17,203,.55), rgba(37,117,252,.55));
    border-radius:8px; border:2px solid transparent; background-clip:padding-box;
  }
  *{scrollbar-width:thin; scrollbar-color:rgba(80,40,180,.3) rgba(14,14,17,.6)}

  @media (prefers-reduced-motion: reduce){*{transition:none !important; animation:none !important}}
</style>
</head>

</div>

  function el(tag, cls, text){
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function creditLines(credit){
    const lines = Array.isArray(credit) ? credit : [credit];
    return lines.map(line => {
      const isObj = typeof line === 'object' && line !== null;
      const text = isObj ? line.text : line;
      return el('p', isObj && line.strike ? 'credit struck' : 'credit', text);
    });
  }

  function nameLine(lvl){
    const p = el('p', 'name', lvl.name);
    if (lvl.id) p.appendChild(el('small', 'lvl-id', 'id: ' + lvl.id));
    return p;
  }

  function mainRow(lvl, rank, tier){
    const li = document.createElement('li');
    li.appendChild(el('div', 'rank', String(rank)));

    const body = el('div', 'body');
    body.appendChild(nameLine(lvl));
    if (lvl.credit) creditLines(lvl.credit).forEach(p => body.appendChild(p));

    const diff = lvl.diff != null ? lvl.diff : DEFAULT_DIFF;
    const feat = lvl.feature != null ? lvl.feature : tier.feature;
    const gddp = lvl.gddp != null ? lvl.gddp : tier.gddp;

    const pills = el('div', 'pills');
    if (gddp && GDDP_NAMES[gddp]) {
      pills.appendChild(el('span', 'pill pill-gddp', GDDP_NAMES[gddp]));
    }
    else if (DIFF_NAMES[diff]) {
      pills.appendChild(el('span', 'pill pill-diff', DIFF_NAMES[diff]));
    }
    if (FEAT_NAMES[feat]) pills.appendChild(el('span', 'pill pill-feat-' + feat, FEAT_NAMES[feat]));
    if (pills.childNodes.length) body.appendChild(pills);

    if (lvl.fp && lvl.fp.length){
      const chips = el('ul', 'fp');
      lvl.fp.forEach(f => chips.appendChild(el('li', null, f)));
      body.appendChild(chips);
    }
    li.appendChild(body);

    const rail = el('div', 'rail');
    if (lvl.stars != null){
      rail.appendChild(el('span', 'num', lvl.stars));
      rail.appendChild(el('span', 'unit', 'Stars'));
    }
    li.appendChild(rail);

    return li;
  }

  function renderMain(){
    const box = document.getElementById('tiers-main');
    box.replaceChildren();

    TIERS.forEach(tier => {
      const upper = tier.to == null ? MAIN_LIST.length : tier.to;
      const slice = MAIN_LIST.slice(tier.from - 1, upper);
      if (!slice.length) return;

      const section = el('div', 'tier tier-' + tier.key);

      const head = el('h3', 'tier-head');
      head.appendChild(el('span', 'dot'));
      head.appendChild(el('span', 'label', tier.label));
      head.appendChild(el('span', 'range',

      section.appendChild(head);

      const ol = el('ol', 'list');

      box.appendChild(section);
    });

  }

      const ul = el('ul', 'log-items');

        li.appendChild(el('span', 'chg chg-' + c.type, c.type));
        li.appendChild(el('span', null, c.text));
        ul.appendChild(li);
        total++;
      });

      body.appendChild(ul);
      wrap.appendChild(body);
      box.appendChild(wrap);
    });

    document.getElementById('count-log').textContent = total + ' changes';
  }
